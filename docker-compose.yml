# GLOBAL DEAL HUNTER — 单文件部署版（拉 DockerHub 镜像，无需 .env、无需 build）
# 用法：保存为 docker-compose.yml，改掉 ADMIN_PASSWORD 和 SECRET_KEY 两处，然后执行
#   docker compose up -d
# 打开 http://服务器IP:8000 ，用 ADMIN_USERNAME / ADMIN_PASSWORD 登录。
services:
  deal-hunter:
    image: fooololo/global-deal-hunter:latest
    container_name: global-deal-hunter
    restart: unless-stopped
    network_mode: bridge
    environment:
      ADMIN_USERNAME: "admin"
      # 必改：换成你自己的密码（明文填这里即可，应用启动时自动哈希，不落盘）
      ADMIN_PASSWORD: "改成你自己的密码"
      # 必改：随机密钥，用 openssl rand -hex 32 生成一条粘贴进来
      SECRET_KEY: "改成随机密钥"
      # 拉取式同步：每 2 小时自动从数据货架拉取最新快照；不需要自动更新就删掉这两行
      FEED_URL: "https://raw.githubusercontent.com/huluohu/global-deal-hunter-feed/main/deals.json"
      FEED_PULL_INTERVAL_HOURS: "2"
      # 直连 http 访问时保持 false；套上 HTTPS 反代后改成 "true"
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - deal_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  deal_data:
