# GLOBAL DEAL HUNTER — 单文件部署版（拉 DockerHub 镜像，无需 .env、无需 build）
# 用法：把本文件放到任意目录，执行  docker compose -f docker-compose.yml up -d
# 然后浏览器打开 http://服务器IP:8000 ，用文件里的管理员账号登录。
services:
  deal-hunter:
    image: fooololo/global-deal-hunter:latest
    container_name: global-deal-hunter
    restart: unless-stopped
    network_mode: bridge
    environment:
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "改成你自己的密码"
      SECRET_KEY: "改成随机密钥"
      # 拉取式同步：每 2 小时自动从数据货架拉取最新快照（改镜像到 v1.2+ 才支持）
      FEED_URL: "https://raw.githubusercontent.com/huluohu/global-deal-hunter-feed/main/deals.json"
      FEED_PULL_INTERVAL_HOURS: "2"
      SYNC_TOKEN: "（可选）推送式备用通道令牌，不用可删此行"
      # 直连 http 访问时保持 false；等你套上 HTTPS 反代后改成 "true"
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

